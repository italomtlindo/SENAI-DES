<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Abastecimentos</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div id="inicio" class="tela">
        <div class="caixa-inicio">
            <div class="icone">
                ⛽
            </div>

            <div class="tema">
                <span>Tema escuro</span>
                <input type="checkbox" id="tema">
            </div>

            <button onclick="entrar()">
                Entrar
            </button>
        </div>
    </div>

    <div id="principal" class="tela escondido">
        <div class="caixa">

            <header>
                <button onclick="voltar()">←</button>

                <h1>Abastecimentos</h1>

                <button onclick="abrirModal()">+</button>
            </header>

            <div class="medias">
               <div>
                    <p>Preço médio</p>

                    <b id="precoMedio">R$ 0,00/L</b>
                </div>

                <div>
                    <p>Consumo médio</p>

                    <b id="consumoMedio">0,00 km/L</b>

                </div>
            </div>

            <div id="lista">

                <p class="vazio">Nenhum abastecimento cadastrado.</p>

            </div>
        </div>
    </div>

    <div id="modal" class="modal">
        <div class="formulario">

            <h2 id="titulo">Novo abastecimento</h2>
            <form onsubmit="salvarAbastecimento(event)">

                <label>Data</label>

                <input type="date" id="data"required>

                <label>Combustível</label>

                <select id="combustivel" required>

                    <option value="">Selecione</option>
                    <option value="Gasolina">Gasolina</option>
                    <option value="Etanol">Etanol</option>
                    <option value="Diesel">Diesel</option>
                    <option value="GNV">GNV</option>

                </select>

                <label>Litros</label>
                <input type="number" id="litros" step="0.01" required>

                <label>Valor pago</label>
                <input type="number" id="valor" step="0.01" required>

                <label>Quilometragem</label>
                <input type="number" id="km" required>

                <button type="submit">Salvar</button>
                <button type="button" class="cancelar" onclick="fecharModal()">Cancelar</button>

            </form>
        </div>
    </div>

    <script src="script.js"></script>

</body>
</html>
