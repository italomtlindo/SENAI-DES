<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Minha Loja</title>
  <link rel="stylesheet" href="style.css" />
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Nunito:wght@400;600;700&display=swap" rel="stylesheet">
</head>
<body>
 
  <header>
    <h1> 🔰Ítalo acessórios🔰</h1>
    <button id="btnAbrir">+ Novo Produto</button>
  </header>
 
  <main>
    <div id="listaProdutos">
      <p id="mensagemVazia">Nenhum produto cadastrado ainda...</p>
    </div>
  </main>
 
  <div id="overlay" class="escondido">
    <div id="modal">
      <h2>Cadastrar Produto</h2>
      <button id="btnFechar">✕</button>
 
      <div class="campo">
        <label for="nome">Nome do produto</label>
        <input type="text" id="nome" placeholder="Ex: Camiseta Vermelha" />
      </div>
 
      <div class="campo">
        <label for="descricao">Descrição</label>
        <input type="text" id="descricao" placeholder="Ex: Camiseta de algodão tamanho M" />
      </div>
 
      <div class="campo">
        <label for="preco">Preço (R$)</label>
        <input type="number" id="preco" placeholder="Ex: 49.90" step="0.01" min="0" />
      </div>
 
      <div class="campo">
        <label for="imagem">URL da imagem</label>
        <input type="text" id="imagem" placeholder="https://exemplo.com/foto.jpg" />
      </div>
 
      <div id="previewContainer" class="escondido">
        <p>Preview:</p>
        <img id="previewImg" src="" alt="preview" />
      </div>
 
      <div id="erroMsg" class="escondido"> Preencha todos os campos</div>
 
      <button id="btnSalvar">Salvar Produto</button>
    </div>
  </div>
 
  <script src="script.js"></script>
</body>
</html>
