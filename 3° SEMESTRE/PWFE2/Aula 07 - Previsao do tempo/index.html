<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Previsao Termica</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="caixa-maior">
      <input class="input-cidade" placeholder="Digite o nome da cidade" />
      <button class="botao-busca" onclick="cliqueinoBotao()">
        <img
          class="img-busca"
          src="https://www.svgrepo.com/show/488200/find.svg"
          alt="busca"
        />
      </button>
      <div class="caixa-media">
        <h2 class="cidade">Tempo em Sao Paulo</h2>
        <p class="temp">21C</p>
        <div class="caixa-menor">
          <img
            class="img-previsao"
            src="https://openweathermap.org/img/wn/04n.png"
            alt="icone-info-tempo"
          />
          <p class="texto-previsao">Nublado</p>
        </div>
        <p class="umidade">Umidade: 70%</p>
      </div>
    </div>
    <script src="script.js"></script>
  </body>
</html>
